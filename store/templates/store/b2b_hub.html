{% extends 'store/base.html' %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 py-10">
    <div class="bg-gradient-to-r from-amber-950 to-emerald-950 text-white p-8 rounded-3xl mb-10">
        <h1 class="text-3xl font-black mb-2">B2B Cafe & Wholesale Portal</h1>
        <p class="text-xs text-amber-200">Supply your cafe with zero-waste edible cups. Tiered discounts start at 200 units.</p>
    </div>

    <!-- Sample Request Form -->
    <div class="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-amber-100 shadow-lg">
        <h3 class="text-xl font-black text-amber-950 mb-4 text-center">Request Free Commercial Sample Kit</h3>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="text-xs font-bold text-amber-900 block mb-1">Cafe / Business Name</label>
                <input required type="text" name="cafe_name" class="w-full px-4 py-2 bg-amber-50 border rounded-xl text-xs">
            </div>
            <div>
                <label class="text-xs font-bold text-amber-900 block mb-1">Contact Person</label>
                <input required type="text" name="contact_person" class="w-full px-4 py-2 bg-amber-50 border rounded-xl text-xs">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-amber-900 block mb-1">City</label>
                    <input required type="text" name="city" class="w-full px-4 py-2 bg-amber-50 border rounded-xl text-xs">
                </div>
                <div>
                    <label class="text-xs font-bold text-amber-900 block mb-1">Monthly Usage</label>
                    <select name="estimated_usage" class="w-full px-4 py-2 bg-amber-50 border rounded-xl text-xs">
                        <option>200 - 500 Cups</option>
                        <option>500 - 1,500 Cups</option>
                        <option>2,000+ Cups</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-800 text-white rounded-xl text-xs font-bold uppercase">Submit Request</button>
        </form>
    </div>
</div>
{% endblock %}
